{% extends "base.html" %}
{% block content %}
<h1 class="text-xl font-bold">Edit Health Note</h1>
<a href="/horse/{{ record.horse_id }}" class="text-blue-500 text-sm">← Back</a>
<form method="POST" action="/edit_health/{{ record.id }}" class="mt-4">
  <input name="note" value="{{ record.note }}" class="border p-2 w-full mb-2 rounded">
  <input type="date" name="date" value="{{ record.date.strftime('%Y-%m-%d') }}" class="border p-2 w-full mb-2 rounded">
  <button class="bg-green-500 text-white p-2 w-full rounded">Save</button>
</form>
{% endblock %}edit_health.html
